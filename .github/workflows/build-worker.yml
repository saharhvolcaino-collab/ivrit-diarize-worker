name: Build worker image

# Builds the RunPod worker in the cloud and publishes it to GitHub's registry,
# so no local Docker is needed and nothing multi-GB is uploaded from a home
# connection. RunPod pulls the published image directly.
#
# No secrets required: every model in the image is ungated.

on:
  push:
    branches: [main, master]
    paths:
      - 'worker/**'
      - 'pipeline/**'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ivrit-diarize-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The image carries several GB of model weights plus the CUDA base,
      # which overflows a stock runner's disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # Move Docker's data root onto /mnt, which has an order of magnitude more
      # space than / on a hosted runner. The full whisper-large-v3 model is
      # twice the size of turbo and pushed the build over the limit on the
      # root filesystem even after the reclaim step above.
      - name: Relocate Docker storage to the large volume
        run: |
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          # BuildKit stages the compressed blobs it pushes through TMPDIR, which
          # lives on / by default. The previous run died with an empty step list
          # and no error - the signature of a runner losing its disk, not of a
          # build failing - so the scratch space moves to the large volume too.
          sudo mkdir -p /mnt/tmp && sudo chmod 777 /mnt/tmp
          echo "TMPDIR=/mnt/tmp" >> $GITHUB_ENV
          df -h / /mnt

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # No GitHub Actions cache. It is capped at 10 GB per repository and
          # this image is well past that once NeMo and four sets of model
          # weights are in it - the export blew the runner's disk and the job
          # was cancelled with no error to read. Pulling the previous image as
          # a cache source costs one registry download and stays within budget.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          provenance: false

      # If a future build dies the same silent way, this is the evidence that
      # says whether it ran out of room or failed for a reason worth reading.
      - name: Disk after build
        if: always()
        run: df -h / /mnt

      - name: Image published
        run: |
          echo "Deploy on RunPod Serverless with image:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
