name: Build worker image

# Builds the RunPod worker in the cloud and publishes it to GitHub's registry,
# so no local Docker is needed and nothing multi-GB is uploaded from a home
# connection. RunPod pulls the published image directly.
#
# No secrets required: every model in the image is ungated.

on:
  push:
    branches: [main, master]
    paths:
      - 'worker/**'
      - 'pipeline/**'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ivrit-diarize-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The image carries several GB of model weights plus the CUDA base,
      # which overflows a stock runner's disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      # Move Docker's data root onto /mnt, which has an order of magnitude more
      # space than / on a hosted runner. The full whisper-large-v3 model is
      # twice the size of turbo and pushed the build over the limit on the
      # root filesystem even after the reclaim step above.
      - name: Relocate Docker storage to the large volume
        run: |
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          # BuildKit stages the compressed blobs it pushes through TMPDIR, which
          # lives on / by default. An earlier build did run out of room on the
          # root filesystem, so the scratch space moves to the large volume too.
          sudo mkdir -p /mnt/tmp && sudo chmod 777 /mnt/tmp
          echo "TMPDIR=/mnt/tmp" >> $GITHUB_ENV
          df -h / /mnt

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Inline cache rather than the GitHub Actions cache: the latter is
          # capped at 10 GB per repository and this image is past that once
          # NeMo and four sets of model weights are in it, so entries were
          # being evicted between builds. Inline metadata rides along inside
          # the image we already push - no extra storage, no cap, and it makes
          # `cache-from: type=registry` actually resolve (a plain image tag
          # carries no cache manifest and would silently cache nothing).
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
          provenance: false
          # pyannote's weights are gated. Mounted as a secret rather than
          # passed as a build-arg, which would sit in the image history for
          # anyone who pulls it. If the secret is unset the bake step fails
          # softly and that engine reports itself missing at runtime.
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      # If a future build dies the same silent way, this is the evidence that
      # says whether it ran out of room or failed for a reason worth reading.
      - name: Disk after build
        if: always()
        run: df -h / /mnt

      - name: Image published
        run: |
          echo "Deploy on RunPod Serverless with image:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
